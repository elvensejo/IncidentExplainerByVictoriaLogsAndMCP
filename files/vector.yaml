sources:
  nginx_logs:
    type: file
    include: ["/var/log/nginx/access.log"]

transforms:
  to_json:
    type: remap
    inputs: [nginx_logs]
    source: |
      parsed = parse_json!(.message)
      . = merge!(., parsed)
      .service = "nginx"

sinks:
  to_victorialogs:
    type: http
    inputs: [to_json]
    uri: "http://victoria_logs_db:9428/insert/jsonline?_msg_field=message&_time_field=timestamp&_stream_fields=service"
    encoding:
      codec: json
    framing:
      method: newline_delimited